<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Танчики PvP — Мультиплеер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117; color: #c9d1d9;
    font-family: 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; min-height: 100vh; padding: 20px;
  }
  h1 { color: #58a6ff; margin-bottom: 15px; }
  .panel {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 10px; padding: 20px; margin-bottom: 15px;
    width: 100%; max-width: 820px;
  }
  input {
    padding: 8px 12px; margin: 5px; border-radius: 6px;
    border: 1px solid #30363d; background: #0d1117; color: #c9d1d9;
    width: 200px;
  }
  button {
    padding: 8px 18px; margin: 5px; border-radius: 6px;
    border: none; background: #238636; color: white;
    cursor: pointer; font-weight: bold;
  }
  button:hover { background: #2ea043; }
  button.danger { background: #da3633; }
  button.danger:hover { background: #f85149; }
  button.secondary { background: #30363d; }
  button.secondary:hover { background: #484f58; }
  canvas {
    border: 2px solid #30363d; border-radius: 10px;
    background: #010409; display: block; cursor: crosshair;
  }
  .hidden { display: none !important; }
  .hud {
    display: flex; justify-content: space-between;
    width: 800px; max-width: 100%; margin-bottom: 10px;
    font-size: 16px; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .hud span { color: #f0883e; font-weight: bold; }
  #status { color: #8b949e; margin: 10px 0; text-align: center; min-height: 24px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; }
  .mp-box { background: #0d1117; border: 1px dashed #30363d; border-radius: 8px; padding: 15px; margin-top: 10px; }
  code { background: #0d1117; padding: 2px 6px; border-radius: 4px; color: #79c0ff; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 13px; }
  .tag.on { background: #238636; color: white; }
  .tag.off { background: #484f58; color: #c9d1d9; }
</style>
<!-- Подключаем PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<h1>💥 Танчики PvP 💥</h1>

<div id="authScreen" class="panel">
  <h2>Вход / Регистрация</h2>
  <div class="row">
    <input id="username" placeholder="Логин" autocomplete="off" />
    <input id="password" type="password" placeholder="Пароль" />
  </div>
  <button onclick="auth('login')">Войти</button>
  <button onclick="auth('register')">Зарегистрироваться</button>
  <p id="authMsg" style="color:#f85149; margin-top:10px;"></p>
</div>

<div id="gameScreen" class="hidden" style="display:flex; flex-direction:column; align-items:center; width:100%;">
  <div class="hud">
    <div>Ваши очки: <span id="myScore">0</span></div>
    <div>Ваше HP: <span id="myHP">100</span></div>
    <div>Статус: <span id="mpStatus" class="tag off">Одиночная</span></div>
  </div>
  <canvas id="game" width="800" height="600"></canvas>
  <p id="status">WASD — движение, Мышь — прицел, ЛКМ — выстрел.</p>
  
  <div class="row">
    <button onclick="startGame()">Начать заново</button>
    <button class="danger" onclick="logout()">Выйти</button>
  </div>

  <div class="panel">
    <h2>🌐 Мультиплеер (Прямое соединение)</h2>
    <p style="color:#8b949e; margin: 8px 0;">
      Ваш ID: <code id="myPeerId">подключение...</code>
      <button class="secondary" onclick="copyId()">Копировать</button>
    </p>
    <div class="mp-box">
      <b>ID друга:</b><br>
      <input id="friendId" placeholder="Вставьте ID друга" />
      <button onclick="connectToFriend()">Подключиться</button>
    </div>
    <p id="mpMsg" style="margin-top:10px; color:#8b949e;"></p>
  </div>
</div>

<script>
  // --- БАЗА ДАННЫХ (localStorage) ---
  const DB = {
    get(key) { return JSON.parse(localStorage.getItem(key) || 'null'); },
    set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
  };
  const getUsers = () => DB.get('users') || {};
  const saveUsers = u => DB.set('users', u);
  
  let currentUser = null;
  
  window.auth = (mode) => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const msg = document.getElementById('authMsg');
    msg.textContent = '';
    
    if (!username || !password) { msg.textContent = 'Заполните поля'; return; }
    const hash = btoa(password);
    const users = getUsers();
    
    if (mode === 'register') {
      if (users[username]) { msg.textContent = 'Пользователь уже существует'; return; }
      users[username] = hash;
      saveUsers(users);
      msg.style.color = '#3fb950'; msg.textContent = 'Успешно! Войдите.';
    } else {
      if (!users[username] || users[username] !== hash) { msg.textContent = 'Неверный логин или пароль'; return; }
      currentUser = username;
      window.showGame();
    }
  };
  
  window.showGame = () => {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    initPeer();
    window.startGame();
  };
  
  window.logout = () => {
    currentUser = null;
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
  };

  // --- ИГРА ---
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  
  let player, remotePlayer, bullets, walls;
  let running, animId, score = 0;
  let keys = {}, mouse = { x: W/2, y: H/2, down: false };
  let lastShot = 0;
  let gameActive = false;

  document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
  });
  canvas.addEventListener('mousedown', () => mouse.down = true);
  canvas.addEventListener('mouseup', () => mouse.down = false);

  window.startGame = () => {
    player = { x: 100, y: H/2, r: 20, hp: 100, angle: 0, color: '#58a6ff' };
    remotePlayer = null;
    bullets = [];
    walls = [
      {x: 300, y: 150, w: 200, h: 20},
      {x: 300, y: H-170, w: 200, h: 20},
      {x: 500, y: 250, w: 20, h: 100}
    ];
    score = 0; running = true; gameActive = true;
    document.getElementById('status').textContent = 'WASD — движение, Мышь — прицел, ЛКМ — выстрел.';
    updateHUD();
    cancelAnimationFrame(animId);
    loop();
  };

  function updateHUD() {
    document.getElementById('myScore').textContent = score;
    document.getElementById('myHP').textContent = Math.max(0, player.hp);
  }

  function loop() {
    if (!running) return;
    if (gameActive) update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  function update() {
    // Движение
    let dx = 0, dy = 0;
    if (keys['w'] || keys['ц']) dy -= 1;
    if (keys['s'] || keys['ы']) dy += 1;
    if (keys['a'] || keys['ф']) dx -= 1;
    if (keys['d'] || keys['в']) dx += 1;
    
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    let newX = player.x + dx * 3;
    let newY = player.y + dy * 3;

    // Коллизии со стенами
    let collide = false;
    for (let w of walls) {
      if (newX + player.r > w.x && newX - player.r < w.x + w.w &&
          newY + player.r > w.y && newY - player.r < w.y + w.h) {
        collide = true; break;
      }
    }
    if (!collide) { player.x = newX; player.y = newY; }
    
    // Границы
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));

    // Прицел
    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

    // Стрельба
    if (mouse.down && Date.now() - lastShot > 400) {
      bullets.push({
        x: player.x + Math.cos(player.angle) * (player.r + 5),
        y: player.y + Math.sin(player.angle) * (player.r + 5),
        vx: Math.cos(player.angle) * 8,
        vy: Math.sin(player.angle) * 8,
        owner: 'me', life: 100
      });
      lastShot = Date.now();
      if (conn && conn.open) conn.send({ type: 'shoot', angle: player.angle, x: player.x, y: player.y });
    }

    // Пули
    bullets = bullets.filter(b => {
      b.x += b.vx; b.y += b.vy; b.life--;
      
      // Стены
      for (let w of walls) {
        if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) return false;
      }
      
      // В противника
      if (b.owner === 'me' && remotePlayer) {
        if (Math.hypot(b.x - remotePlayer.x, b.y - remotePlayer.y) < 20) {
          if (conn && conn.open) conn.send({ type: 'hit' });
          remotePlayer.hp -= 20;
          return false;
        }
      }
      
      // В меня
      if (b.owner === 'enemy') {
        if (Math.hypot(b.x - player.x, b.y - player.y) < 20) {
          player.hp -= 20;
          updateHUD();
          if (player.hp <= 0) gameOver();
          return false;
        }
      }

      return b.life > 0 && b.x > 0 && b.x < W && b.y > 0 && b.y < H;
    });

    // Синхронизация позиции
    if (conn && conn.open) conn.send({ type: 'pos', x: player.x, y: player.y, angle: player.angle, hp: player.hp });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // Сетка
    ctx.strokeStyle = '#0d1a2b'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Стены
    ctx.fillStyle = '#30363d';
    for (let w of walls) ctx.fillRect(w.x, w.y, w.w, w.h);

    // Пули
    for (let b of bullets) {
      ctx.fillStyle = b.owner === 'me' ? '#f0e130' : '#ff7b72';
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    }

    // Второй игрок
    if (remotePlayer) {
      ctx.save();
      ctx.translate(remotePlayer.x, remotePlayer.y);
      ctx.rotate(remotePlayer.angle);
      ctx.fillStyle = '#f85149';
      ctx.fillRect(-15, -15, 30, 30);
      ctx.fillStyle = '#30363d';
      ctx.fillRect(0, -4, 25, 8);
      ctx.restore();
      
      // HP над врагом
      ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('HP: ' + remotePlayer.hp, remotePlayer.x, remotePlayer.y - 30);
    }

    // Мой игрок
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = player.color;
    ctx.fillRect(-15, -15, 30, 30);
    ctx.fillStyle = '#c9d1d9';
    ctx.fillRect(0, -4, 25, 8);
    ctx.restore();

    // Прицел
    ctx.strokeStyle = '#f0e130'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI*2); ctx.stroke();
  }

  function gameOver() {
    gameActive = false;
    document.getElementById('status').textContent = `Вы уничтожены! Ваш счёт: ${score}`;
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f85149'; ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2);
  }

  // --- МУЛЬТИПЛЕЕР (PeerJS) ---
  let peer = null, conn = null;

  window.initPeer = () => {
    if (peer) return;
    
    peer = new Peer(null, {
      host: 'xfenix.ru',
      secure: true,
      port: 443,
      path: '/'
    });
    
    peer.on('open', id => {
      document.getElementById('myPeerId').textContent = id;
    });
    
    peer.on('error', (err) => {
      console.log('Ошибка PeerJS:', err);
      document.getElementById('myPeerId').textContent = 'Ошибка сети (попробуйте VPN)';
    });
    
    peer.on('connection', c => {
      if (conn) { c.close(); return; }
      conn = c;
      setupConn();
      setStatus('Мультиплеер', true);
      document.getElementById('mpMsg').textContent = 'К вам подключились!';
    });
  };

  window.connectToFriend = () => {
    const friendId = document.getElementById('friendId').value.trim();
    if (!friendId) { alert('Введите ID друга'); return; }
    if (conn) { alert('Уже подключено'); return; }
    if (!peer) { alert('Сначала войдите'); return; }
    
    conn = peer.connect(friendId);
    setupConn();
  };

  function setupConn() {
    conn.on('open', () => {
      setStatus('Мультиплеер', true);
      document.getElementById('mpMsg').style.color = '#3fb950';
      document.getElementById('mpMsg').textContent = 'Соединение установлено!';
      
      // Старт игры для обоих
      window.startGame();
    });
    
    conn.on('data', data => {
      if (data.type === 'pos') {
        if (!remotePlayer) remotePlayer = { x: data.x, y: data.y, angle: data.angle, hp: data.hp };
        else { 
          remotePlayer.x = data.x; 
          remotePlayer.y = data.y; 
          remotePlayer.angle = data.angle;
          remotePlayer.hp = data.hp;
        }
      } else if (data.type === 'shoot') {
        bullets.push({
          x: data.x + Math.cos(data.angle) * 25,
          y: data.y + Math.sin(data.angle) * 25,
          vx: Math.cos(data.angle) * 8,
          vy: Math.sin(data.angle) * 8,
          owner: 'enemy', life: 100
        });
      } else if (data.type === 'hit') {
        score += 100;
        updateHUD();
      }
    });

    conn.on('close', () => {
      conn = null;
      remotePlayer = null;
      setStatus('Одиночная', false);
      document.getElementById('mpMsg').textContent = 'Соединение разорвано';
    });
  }

  function setStatus(text, on) {
    const el = document.getElementById('mpStatus');
    if (el) { el.textContent = text; el.className = 'tag ' + (on ? 'on' : 'off'); }
  }

  window.copyId = () => {
    const id = document.getElementById('myPeerId').textContent;
    if (id && id !== 'подключение...') navigator.clipboard.writeText(id);
  };

  // Запуск
  window.addEventListener('load', () => {
    const saved = DB.get('currentUser');
    if (saved) { currentUser = saved; window.showGame(); }
  });
</script>
</body>
</html>
