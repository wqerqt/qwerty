<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Крестики-нолики — Образовательные вопросы</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117; color: #c9d1d9;
    font-family: 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; min-height: 100vh; padding: 20px;
  }
  h1 { color: #58a6ff; margin-bottom: 15px; }
  .panel {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 10px; padding: 20px; margin-bottom: 15px;
    width: 100%; max-width: 500px;
  }
  input {
    padding: 8px 12px; margin: 5px; border-radius: 6px;
    border: 1px solid #30363d; background: #0d1117; color: #c9d1d9;
    width: 200px;
  }
  button {
    padding: 8px 18px; margin: 5px; border-radius: 6px;
    border: none; background: #238636; color: white;
    cursor: pointer; font-weight: bold;
  }
  button:hover { background: #2ea043; }
  button.secondary { background: #30363d; }
  button.secondary:hover { background: #484f58; }
  .hidden { display: none !important; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 5px;
    background: #30363d;
    padding: 5px;
    border-radius: 10px;
    margin-top: 10px;
  }
  .cell {
    background: #161b22;
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; font-weight: bold;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.2s;
  }
  .cell:hover { background: #21262d; }
  .cell.x { color: #58a6ff; }
  .cell.o { color: #f85149; }
  #status { color: #8b949e; margin: 15px 0; text-align: center; min-height: 24px; font-size: 18px; font-weight: bold;}
  
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 8px; border-bottom: 1px solid #30363d; text-align: left; }
  th { color: #58a6ff; }

  .mp-box { background: #0d1117; border: 1px dashed #30363d; border-radius: 8px; padding: 15px; margin-top: 10px; }
  code { background: #0d1117; padding: 2px 6px; border-radius: 4px; color: #79c0ff; }

  /* Модальное окно для вопросов */
  #questionModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  #questionModal.hidden { display: none !important; }
  .q-box {
    background: #161b22; border: 2px solid #58a6ff;
    border-radius: 14px; padding: 25px; max-width: 500px; width: 90%;
    text-align: center;
    box-shadow: 0 0 30px rgba(88,166,255,0.3);
  }
  .q-box h3 { margin-bottom: 20px; color: #c9d1d9; font-size: 20px; }
  .q-options button {
    display: block; width: 100%;
    margin: 8px 0; background: #21262d; color: #c9d1d9;
    font-size: 16px; padding: 12px;
  }
  .q-options button:hover { background: #30363d; }
  .q-options button.correct { background: #238636; color: white; }
  .q-options button.wrong { background: #da3633; color: white; }
</style>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<h1>⭕ Крестики-нолики ❌</h1>

<div id="authScreen" class="panel">
  <h2>Вход / Регистрация</h2>
  <div style="display:flex; flex-wrap:wrap;">
    <input id="username" placeholder="Логин" autocomplete="off" />
    <input id="password" type="password" placeholder="Пароль" />
  </div>
  <button onclick="auth('login')">Войти</button>
  <button onclick="auth('register')">Зарегистрироваться</button>
  <p id="authMsg" style="color:#f85149; margin-top:10px;"></p>
</div>

<div id="gameScreen" class="hidden" style="display:flex; flex-direction:column; align-items:center;">
  <p id="status">Соединение...</p>
  <div id="board"></div>
  
  <div class="panel" style="margin-top:20px;">
    <h2>🌐 Мультиплеер (Прямое соединение)</h2>
    <p style="color:#8b949e; margin: 8px 0;">
      Ваш ID: <code id="myPeerId">подключение...</code>
      <button class="secondary" onclick="copyId()">Копировать</button>
    </p>
    <div class="mp-box">
      <b>ID друга:</b><br>
      <input id="friendId" placeholder="Вставьте ID друга" />
      <button onclick="connectToFriend()">Подключиться</button>
    </div>
    <p id="mpMsg" style="margin-top:10px; color:#8b949e;"></p>
  </div>

  <div class="panel">
    <h2>🏆 Общая статистика сайта</h2>
    <table id="leaderboard">
      <thead><tr><th>Игрок</th><th>Победы</th><th>Поражения</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  
  <button class="secondary" onclick="resetGame()">Начать заново</button>
</div>

<!-- Модальное окно вопроса -->
<div id="questionModal" class="hidden">
  <div class="q-box">
    <h3 id="qText">Вопрос</h3>
    <div class="q-options" id="qOptions"></div>
  </div>
</div>

<script>
  // --- FIREBASE SDK ---
  let db, currentUser = null;
  
  async function initFirebase() {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
    const { getFirestore, collection, getDocs, setDoc, doc, query, updateDoc, increment, getDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

    const firebaseConfig = {
      apiKey: "AIzaSyB_8U1TVXhm_josJPrGzc8g1XPKwkrCQVM",
      authDomain: "game-6dc1e.firebaseapp.com",
      projectId: "game-6dc1e",
      storageBucket: "game-6dc1e.firebasestorage.app",
      messagingSenderId: "430588155366",
      appId: "1:430588155366:web:fc79d342feadefa9e49f227",
      measurementId: "G-NQH7JR6LT1"
    };

    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    window._fb = { collection, getDocs, setDoc, doc, query, updateDoc, increment, getDoc };
  }

  // --- АВТОРИЗАЦИЯ ---
  window.auth = async (mode) => {
    if (!db) { await initFirebase(); }
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const msg = document.getElementById('authMsg');
    msg.textContent = '';

    if (!username || !password) { msg.textContent = 'Заполните поля'; return; }
    const hash = btoa(password);

    try {
      const { setDoc, doc, getDoc } = window._fb;
      const userDoc = doc(db, "users", username);
      const userSnap = await getDoc(userDoc);
      let exists = userSnap.exists();

      if (mode === 'register') {
        if (exists) { msg.textContent = 'Пользователь уже существует'; return; }
        await setDoc(userDoc, { password: hash, wins: 0, losses: 0 });
        msg.style.color = '#3fb950'; msg.textContent = 'Успешно! Войдите.';
      } else {
        if (!exists) { msg.textContent = 'Неверный логин или пароль'; return; }
        if (userSnap.data().password !== hash) { msg.textContent = 'Неверный логин или пароль'; return; }
        
        currentUser = username;
        window.showGame();
      }
    } catch (e) {
      msg.textContent = 'Ошибка БД: ' + e.message;
    }
  };

  window.showGame = () => {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    initPeer();
    renderLeaderboard();
    window.resetGame();
  };
  
  window.logout = () => {
    currentUser = null;
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
  };

  // --- СТАТИСТИКА (Firebase) ---
  async function addWin() {
    try {
      const { doc, updateDoc, increment } = window._fb;
      await updateDoc(doc(db, "users", currentUser), { wins: increment(1) });
      renderLeaderboard();
    } catch(e) { console.log(e); }
  }

  async function addLoss() {
    try {
      const { doc, updateDoc, increment } = window._fb;
      await updateDoc(doc(db, "users", currentUser), { losses: increment(1) });
      renderLeaderboard();
    } catch(e) { console.log(e); }
  }

  async function renderLeaderboard() {
    try {
      const { collection, getDocs, query } = window._fb;
      const querySnapshot = await getDocs(query(collection(db, "users")));
      const tbody = document.querySelector('#leaderboard tbody');
      tbody.innerHTML = '';
      
      let users = [];
      querySnapshot.forEach(doc => {
        const data = doc.data();
        users.push({ name: doc.id, wins: data.wins || 0, losses: data.losses || 0 });
      });

      users.sort((a, b) => b.wins - a.wins);

      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3">Пока нет данных</td></tr>';
      } else {
        users.forEach(u => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${u.name}</td><td>${u.wins}</td><td>${u.losses}</td>`;
          tbody.appendChild(row);
        });
      }
    } catch (e) { console.log(e); }
  }

  // --- БАЗА ВОПРОСОВ ---
  const QUESTIONS = [
    { q: "Сколько будет 7 + 8?", options: ["15", "16", "14", "13"], correct: 0 },
    { q: "Какое животное самое большое на планете?", options: ["Слон", "Синий кит", "Жираф", "Акула"], correct: 1 },
    { q: "Столица России?", options: ["Санкт-Петербург", "Москва", "Казань", "Новосибирск"], correct: 1 },
    { q: "Сколько цветов в радуге?", options: ["5", "6", "7", "8"], correct: 2 },
    { q: "Какой газ мы вдыхаем для жизни?", options: ["Углекислый газ", "Азот", "Кислород", "Водород"], correct: 2 },
    { q: "Сколько сторон у квадрата?", options: ["3", "4", "5", "6"], correct: 1 },
    { q: "Кто написал 'Война и мир'?", options: ["Пушкин", "Толстой", "Достоевский", "Чехов"], correct: 1 },
    { q: "Сколько дней в неделе?", options: ["5", "6", "7", "8"], correct: 2 },
    { q: "Какая планета ближе всего к Солнцу?", options: ["Венера", "Меркурий", "Земля", "Марс"], correct: 1 },
    { q: "Сколько будет 9 * 9?", options: ["81", "72", "90", "99"], correct: 0 }
  ];

  // --- ИГРА (Крестики-нолики) ---
  let board = ['', '', '', '', '', '', '', '', ''];
  let mySymbol = 'X';
  let isMyTurn = false;
  let gameActive = false;
  let pendingMoveIndex = -1; // Индекс, куда хотел походить игрок

  window.resetGame = () => {
    board = ['', '', '', '', '', '', '', '', ''];
    gameActive = true;
    isMyTurn = (mySymbol === 'X');
    renderBoard();
    updateStatus();
  };

  function renderBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (board[i] === 'X') cell.classList.add('x');
      if (board[i] === 'O') cell.classList.add('o');
      cell.textContent = board[i];
      cell.onclick = () => makeMove(i);
      boardEl.appendChild(cell);
    }
  }

  function updateStatus() {
    const statusEl = document.getElementById('status');
    if (!gameActive) return;
    statusEl.textContent = isMyTurn ? 'Ваш ход (' + mySymbol + ')' : 'Ход противника...';
  }

  function makeMove(index) {
    if (!gameActive || !isMyTurn || board[index] !== '') return;
    
    // Запускаем вопрос перед ходом
    pendingMoveIndex = index;
    showQuestion();
  }

  // --- МОДАЛЬНОЕ ОКНО ВОПРОСОВ ---
  function showQuestion() {
    const q = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
    const modal = document.getElementById('questionModal');
    const qText = document.getElementById('qText');
    const qOptions = document.getElementById('qOptions');

    qText.textContent = q.q;
    qOptions.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(idx, q.correct, btn);
      qOptions.appendChild(btn);
    });

    modal.classList.remove('hidden');
  }

  function checkAnswer(selected, correct, btn) {
    const modal = document.getElementById('questionModal');
    const allBtns = document.querySelectorAll('#qOptions button');
    
    // Блокируем кнопки
    allBtns.forEach(b => b.disabled = true);
    
    if (selected === correct) {
      btn.classList.add('correct');
      setTimeout(() => {
        modal.classList.add('hidden');
        executeMove(pendingMoveIndex);
      }, 1000);
    } else {
      btn.classList.add('wrong');
      // Показываем правильный ответ
      allBtns[correct].classList.add('correct');
      
      setTimeout(() => {
        modal.classList.add('hidden');
        document.getElementById('status').textContent = 'Неправильный ответ! Ход переходит противнику.';
        isMyTurn = false;
        pendingMoveIndex = -1;
        updateStatus(); // Обновляем статус, чтобы было видно, что ход перешел
        if (conn && conn.open) conn.send({ type: 'skip_turn' }); // Сообщаем другу, что мы промахнулись
      }, 2000);
    }
  }

  function executeMove(index) {
    board[index] = mySymbol;
    isMyTurn = false;
    renderBoard();
    updateStatus();
    
    if (checkWin(mySymbol)) {
      gameActive = false;
      document.getElementById('status').textContent = 'Вы победили! 🎉';
      addWin();
      return;
    }
    if (board.every(c => c !== '')) {
      gameActive = false;
      document.getElementById('status').textContent = 'Ничья!';
      return;
    }
    
    if (conn && conn.open) {
      conn.send({ type: 'move', index, symbol: mySymbol });
    }
  }

  function checkWin(symbol) {
    const wins = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];
    return wins.some(line => line.every(i => board[i] === symbol));
  }

  // --- МУЛЬТИПЛЕЕР (PeerJS) ---
  let peer = null, conn = null;

  window.initPeer = () => {
    if (peer) return;
    peer = new Peer(null, {
      host: 'xfenix.ru',
      secure: true,
      port: 443,
      path: '/'
    });
    
    peer.on('open', id => {
      document.getElementById('myPeerId').textContent = id;
    });
    
    peer.on('error', (err) => {
      document.getElementById('myPeerId').textContent = 'Ошибка сети';
    });
    
    peer.on('connection', c => {
      if (conn) { c.close(); return; }
      conn = c;
      mySymbol = 'O'; // Хост играет за O
      setupConn();
      document.getElementById('mpMsg').style.color = '#3fb950';
      document.getElementById('mpMsg').textContent = 'К вам подключились!';
    });
  };

  window.connectToFriend = () => {
    const friendId = document.getElementById('friendId').value.trim();
    if (!friendId) { alert('Введите ID друга'); return; }
    if (conn) { alert('Уже подключено'); return; }
    if (!peer) { alert('Сначала войдите'); return; }
    
    conn = peer.connect(friendId);
    mySymbol = 'X'; // Тот, кто подключается — X
    setupConn();
  };

  function setupConn() {
    conn.on('open', () => {
      document.getElementById('mpMsg').style.color = '#3fb950';
      document.getElementById('mpMsg').textContent = 'Соединение установлено!';
      window.resetGame();
    });
    
    conn.on('data', data => {
      if (data.type === 'move') {
        board[data.index] = data.symbol;
        isMyTurn = true;
        renderBoard();
        updateStatus();
        
        if (checkWin(data.symbol)) {
          gameActive = false;
          document.getElementById('status').textContent = 'Вы проиграли 😢';
          addLoss();
          return;
        }
        if (board.every(c => c !== '')) {
          gameActive = false;
          document.getElementById('status').textContent = 'Ничья!';
        }
      } else if (data.type === 'skip_turn') {
        // Противник неправильно ответил и пропускает ход
        isMyTurn = true;
        updateStatus();
        document.getElementById('status').textContent = 'Противник ошибся! Ваш ход.';
      }
    });

    conn.on('close', () => {
      conn = null;
      document.getElementById('mpMsg').textContent = 'Соединение разорвано';
    });
  }

  window.copyId = () => {
    const id = document.getElementById('myPeerId').textContent;
    if (id && id !== 'подключение...') navigator.clipboard.writeText(id);
  };

  // Запуск
  window.addEventListener('load', () => {
    initFirebase();
  });
</script>
</body>
</html>
